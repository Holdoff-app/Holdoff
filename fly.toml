# fly.toml app configuration file generated for holdoff on 2026-07-04T06:33:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "holdoff"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/api/health', timeout = '10s' }]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']
  size = 'shared-cpu-1x'
