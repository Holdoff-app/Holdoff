# fly.toml app configuration file generated for holdoff on 2026-07-04T04:20:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "holdoff"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/api/health', timeout = '10s' }]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '71gb'
  cpu_kind = 'performance'
  cpus = 16
  memory_mb = 72704
  processes = ['app']
  size = 'performance-cpu-16x'
