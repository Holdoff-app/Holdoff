app = "holdoff"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # /healthz returns 503 when Postgres or the AI provider is unreachable.
  # /api/health always returns 200, which is why earlier broken deploys still
  # reported healthy.
  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
