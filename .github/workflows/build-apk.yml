name: Build HoldOff APK

on:
  push:
    branches: [main]
    paths:
      # :app maps to android-app/app (see settings.gradle.kts). The old 'app/**' filter
      # watched a tree that Gradle never compiles, so no source change ever built.
      - 'android-app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: holdoff-debug-apk
          # Sources live in android-app/, but build.gradle.kts redirects buildDirectory
          # to <root>/app/build, so artifacts land here.
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
