name: Build HoldOff release bundle

on:
  workflow_dispatch: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set — cannot produce a Play-acceptable bundle." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release AAB
        env:
          HOLDOFF_API_KEY: ${{ secrets.HOLDOFF_API_KEY }}
          HOLDOFF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HOLDOFF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HOLDOFF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export HOLDOFF_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: holdoff-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
